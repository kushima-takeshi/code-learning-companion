services:
  postgres:
    image: postgres:16-alpine
    container_name: clc-postgres
    environment:
      POSTGRES_USER: clc
      POSTGRES_PASSWORD: clc
      POSTGRES_DB: clc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clc -d clc"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: clc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: clc-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://clc:clc@postgres:5432/clc?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    
  frontend:
    image: node:22-bookworm
    container_name: clc-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  go_mod_cache:
  frontend_node_modules: